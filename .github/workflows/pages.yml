name: Deploy site to GitHub Pages

# Canonical marketing host — see docs/SITE_HOSTING.md (not Cloudflare Pages).
on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always run on site changes — keeps PR checks green without requiring Pages.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert marketing site present
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/assets/site.css
          test -f site/assets/app.js
          test -f site/assets/chrome.js
          test -f site/CNAME
          test -f site/.nojekyll
          grep -q '^mcflyads.com$' site/CNAME
          grep -q "Cash Ledger" site/assets/site.css
          grep -q 'data-mer-count' site/index.html
          grep -q 'data-desk' site/index.html

  # Deploy only from main (or manual dispatch). enablement: true creates the
  # Pages site on first successful run if Settings → Pages is still unset.
  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
